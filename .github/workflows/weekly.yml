name: 生成本周精选
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"
permissions:
  contents: write
  issues: read
jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: AI 获取、去重与筛选
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: node scripts/weekly.mjs
      - name: 提交新一期
        run: |
          git config user.name "frontier-weekly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json data/archive.json
          git diff --cached --quiet || git commit -m "更新本周精选"
          git push
